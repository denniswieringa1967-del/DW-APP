<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1730" />
  <meta name="description" content="DW APP – professionele buitendienstapp voor Woningcheck, AI Efficiency Scan en Energie & Compliance." />
  <link rel="icon" href="dw-logo.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <title>DW APP</title>
<style>

/* DW masterbrief V2 — visual layer only, 22 September 2026 */
:root{--ink:#102447;--ink2:#102447;--muted:#536582;--line:#dae3f2;--line2:#c7d3e7;--bg:#f4f7fc;--soft:#eaf0fc;--blue:#245eea;--blue2:#174ac1;--green:#087f75;--green-soft:#edf8f5;--amber:#8a5700;--red:#a62032;--radius:14px}
body{background:var(--bg);line-height:1.55}.hero{background:linear-gradient(120deg,#09172f,#102447);border-radius:18px}.hero .eyebrow{color:#ffc56a}.card,.progress-card,.stat-card{border-radius:14px}.primary{background:#245eea;border-radius:8px;box-shadow:none}.primary:hover{background:#174ac1}.secondary,.ghost,.danger,.icon-button{border-radius:8px}.route-icon{border-radius:14px;color:#245eea;background:#eaf0fc}.progress-track i{background:#245eea}.hero h1{line-height:1.12}.route-card p{max-width:100%}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #245eea;outline-offset:3px}input,select,textarea{border-radius:8px}h2,h3{line-height:1.25}
@media(max-width:600px){.main{width:calc(100% - 24px)}.hero{padding:24px}.primary,.secondary,.ghost,.danger{min-height:48px}.hero h1{font-size:32px}.card{padding:18px}.topbar{gap:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

</style>

<style id="dw-return-marketing-style">.dw-return-marketing{display:inline-flex;align-items:center;min-height:44px;max-width:100%;box-sizing:border-box;font-size:14px;font-weight:600;line-height:1.5;color:inherit;text-decoration:none;overflow-wrap:anywhere}.dw-return-marketing:hover{text-decoration:underline}.dw-return-marketing:focus-visible{outline:3px solid #c59418;outline-offset:3px}.dw-return-marketing-row{padding:6px clamp(14px,3vw,28px);color:#334155}</style>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="brandButton" class="brand" type="button" aria-label="Naar start">
        <img class="brand-logo" src="dw-logo.png" alt="DW-logo" width="48" height="48">
        <span class="brand-copy"><strong>DW APP</strong><small>DW Marketing</small></span>
      </button>
      <div class="topbar-actions">
        <button id="clientModeButton" class="mode-chip" type="button" title="Klantweergave">Klantweergave</button>
        <span id="syncBadge" class="status-chip status-safe">Testmodus</span>
        <button id="menuButton" class="icon-button" type="button" aria-label="Menu" aria-expanded="false">•••</button>
      </div>
    </header>
    <div class="dw-return-marketing-row"><a class="dw-return-marketing" href="https://dw-marketing.nl">← Terug naar DW Marketing</a></div>

    <main id="main" class="main" tabindex="-1"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Hoofdnavigatie">
      <button data-nav="home" class="nav-item active" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><small>Start</small>
      </button>
      <button data-nav="visits" class="nav-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/></svg><small>Bezoeken</small>
      </button>
      <button data-nav="drafts" class="nav-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10zM14 6l3.5 3.5"/></svg><small>Concepten</small>
      </button>
      <button data-nav="settings" class="nav-item" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0-5v2m0 14v2m9-9h-2M5 12H3m15.4-6.4-1.4 1.4M7 17l-1.4 1.4M18.4 18.4 17 17M7 7 5.6 5.6"/></svg><small>Instellingen</small>
      </button>
    </nav>
  </div>

  <dialog id="menuDialog" class="sheet">
    <div class="sheet-card">
      <div class="sheet-head">
        <div><small>Ingelogd als</small><strong id="menuEmployee">Medewerker</strong></div>
        <button id="closeMenuButton" class="icon-button" type="button" aria-label="Sluiten">×</button>
      </div>
      <div class="sheet-info">
        <span class="sheet-dot"></span>
        <p id="menuModeText"><strong>Veilige testmodus.</strong><br>Er wordt nog niets naar productie verstuurd.</p>
      </div>
      <button id="exportAllButton" class="secondary wide" type="button">Alle lokale dossiers exporteren</button>
      <button id="resetDemoButton" class="danger wide" type="button">Lokale testgegevens wissen</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="data-service.js"></script>
  <script src="scans.js"></script>
  <script src="production-adapter.js"></script>
  <script src="app.js"></script>
</body>
</html>
